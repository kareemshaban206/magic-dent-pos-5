name: Build Web App to APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup project and prepare artifact
        run: |
          echo "Preparing Magic Dent POS files..."
          mkdir -p public_build
          cp -r * public_build/ 2>/dev/null || true

      - name: Upload Built App
        uses: actions/upload-artifact@v3
        with:
          name: Magic-Dent-POS-Final
          path: public_build/
