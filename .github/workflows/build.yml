name: Build Web App to APK
on:
  push:
    branches: [ main ]
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '18'
            
        - name: Archive Files (ZIP)
          run: |
            zip -r magic-dent-pos.zip .
            
        - name: Upload APK/Artifact package
          uses: actions/upload-artifact@v3
          with:
            name: Magic-Dent-POS-App
            path: magic-dent-pos.zip
